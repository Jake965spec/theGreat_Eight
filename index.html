<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Great Eight</title>

  <style>
    body {
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      background: radial-gradient(circle at top, #0f5132, #082c1f);
      color: #f5f5f5;
    }

    header {
      padding: 1.8rem 1rem 1.4rem;
      text-align: center;
      border-bottom: 1px solid rgba(255, 215, 0, 0.25);
    }

    .logo {
      max-width: 620px;
      margin: 0 auto;
    }

    .subtitle {
      margin-top: 0.4rem;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #d4af37;
    }

    iframe {
      width: 80%;
      height: calc(100vh - 120px);
      border: none;
      background: white;
    }
  </style>
</head>

<body>
  <header>
    <!-- SVG LOGO -->
    <svg
      class="logo"
      viewBox="0 0 600 220"
      xmlns="http://www.w3.org/2000/svg"
      aria-label="The Great Eight Logo"
    >
      <!-- Badge -->
      <rect
        x="20"
        y="20"
        width="560"
        height="140"
        rx="70"
        fill="#0b3d2e"
        stroke="#d4af37"
        stroke-width="6"
      />

      <!-- Golf hole -->
      <circle cx="90" cy="140" r="10" fill="#111" />
      <line
        x1="90"
        y1="40"
        x2="90"
        y2="130"
        stroke="#f5f5f5"
        stroke-width="4"
      />

      <!-- Flag -->
      <path
        d="M90 45 L140 60 L90 75 Z"
        fill="#d4af37"
        stroke="#b8962e"
        stroke-width="2"
      />

      <!-- Main Text -->
      <text
        x="300"
        y="105"
        text-anchor="middle"
        font-size="54"
        font-weight="700"
        letter-spacing="6"
        fill="#f5f5f5"
      >
        THE GREAT EIGHT
      </text>

      <!-- Decorative dots -->
      <circle cx="470" cy="90" r="5" fill="#d4af37" />
      <circle cx="495" cy="90" r="5" fill="#d4af37" />
      <circle cx="520" cy="90" r="5" fill="#d4af37" />
    </svg>

    <div class="subtitle">Championship Leaderboard</div>
  </header>

  <iframe
    src="https://embed.golfify.io/leaderboard?eventId=-Ohu40VtThUN2pep9nkY&isMultiRoundEvent=true"
    loading="lazy">
  </iframe>
</body>
</html>
